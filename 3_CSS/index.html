<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS</title>
    <!--3 - Internal Css-->
    <style>
      p {
        color: rgb(11, 0, 128);
        font-size: 40px;
      }
      </style>
      <!--4 - External Css-->
      <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
      <!--1 - Inline Css-->
      <h1 style="color: red">Mudar cor com o Inline.</h1>
      <h1 style="color: blue">Outro título.</h1>
      
      <!--2 - Múltiplas regras-->
      <h1 style="color:purple; font-size: 40px; border-bottom: 4px solid red;">Mudar cor e tamanho da fonte. </h1>
      
      <!--3 - Internal Css-->
      <p>Eu fui estilizado pelo internal.</p>
      <p>Mais um parágrafo estilizado pelo internal.</p>
      <p>Outro parágrafo estilizado pelo internal.</p>
      
      <!--4 - External Css-->
      <h3>Meu título verde!</h3>
</body>
</html>
