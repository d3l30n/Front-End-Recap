<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h2>Formulários HTML</h2>
  <!--1 - Primeiro Formulário-->
  <!--2 - Atributos Formulário-->
  
  <form action="register.php" method="get">

    <div>
      <label>Nome:</label>
      <input type="text">
   
    </div>
    <!--3 - Atributo Name-->
    <div>
    <!--4 - Atributo Label-->
      
      <label for="age">Idade:</label>
      <input type="text" name="age">
    </div>
    <!--6 - Select-->
    <div> 
      <label for="job">Selecione a sua Profissão: 
         <select name="job">
           <option value="developer">Desenvolvedor</option>
           <option value="designer">Designer</option>
           <option value="manager">Gerente</option>
         </select>
      </label> 

    </div>
    <!--7 - Atributo Selected-->
    <div>
      <label for="contract">Você leu os termos do contrato?</label>
      <select name="contract">
        <option value="yes">Sim</option>
        <option value="no" selected>Não</option>
      </select>
      
    <!--8 - Múltiplas Opções-->
    <div>
      <label for="items"> Selecione os itens desejados:</label>
      <select name="items" multiple>
        <option value="item1">Item 1</option>
        <option value="item2">Item 2</option>
        <option value="item3">Item 3</option>
      </select>
    </div>
    
    <!--9 - Textarea-->
    <div>
      <label for="comment">Escreva abaixo o que você achou do post:</label>
      <textarea name="comment"></textarea>
    </div>

    <!--10 - fieldset e legend-->
    <div>
      <fieldset>
         <legend>Preencha as suas informações:</legend>
         <label for="firstname">Nome:</label>
         <input type="text" name="firstname">
         <label for="lastname">Sobrenome:</label>
         <input type="text" name="lastname">
      </fieldset>
    </div>

    <!--11 - Datalist-->
    <div> 
      <label for="flavour">Escolha o sabor:</label>
      <input type="text" name="flavour" list="flavours">

      <datalist id="flavours">
        <option value="Chocolate"></option>
        <option value="Morango"></option>
        <option value="Baunilha"></option>
      </datalist>
    </div>
    <!--12 - Input para Senhas-->
    <div>
      <label for="password">Digite a sua Senha:</label>
      <input type="password" name="password">
    </div>

    <!--14 - radio button-->
    <div>
      <label for="car_model">Escolha o modelo do seu carro:</label>
      <div class="radio">
        <input type="radio" value="bmw" name="car_model">
        <label for="bmw">BMW</label>
      </div>
            <div class="radio">
        <input type="radio" value="Ferrari" name="car_model">
        <label for="Ferrari">Ferrari</label>
      </div>
            <div class="radio">
        <input type="radio" value="Renault" name="car_model">
        <label for="Renault">Renault</label>
      </div>
    </div>
    <!--15 - checkbox-->
    <div>
      <label for="optionals">Opcionais do Carro:</label>
      <div class="radio">
        <input type="checkbox" name="optionals[]" value="big_tires">
        <label for="big_tires">Pneus grandes</label>
      </div>
            <div class="radio">
        <input type="checkbox" name="optionals[]" value="turbo_engine">
        <label for="turbo_engine">Motor Turbo</label>
      </div>
            <div class="radio">
        <input type="checkbox" name="optionals[]" value="hybrid">
        <label for="hybrid">Híbrido</label>
      </div>
    </div>

    <!--16 - Datas-->
    <div>
      <label for="birthday">Data de Nascimento:</label>
      <input type="date" name="birthday">
    </div>

    <!--17 - Arquivos-->
    <div>
      <label for="image">Insira a sua imagem:</label>
      <input type="file" name="image">
    </div>

    <!--18 - Números-->
    <div>
      <label for="salary">Quanto você ganha por mês?</label>
      <input type="number" name="salary">
    </div>

    <!--19 - Input para e-mails-->
    <div>
      <label for="email">Digite o seu email:</label>
      <input type="email" name="email">
    </div>

    <!--20 - Value-->
    <div>
      <label for="value">Digite um valor:</label>
      <input type="text" value="Digite aqui" name="value">
    </div>
    
    <!--21 - Disabled-->
    <div>
      <label for="disabled">Tente mudar o valor:</label>
      <input type="text" name="disabled" disabled>
    </div>

    <!--13 - Resetar Form-->
    <input type="reset" value="Limpar">
    <!--5 - Envio de Form-->
    <input type="submit" value="Enviar">
  </form>

</body>
</html>
